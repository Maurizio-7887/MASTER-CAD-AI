<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ nome }} · AR</title>
<script src="{{ url_for('ar.static', filename='vendor/model-viewer-umd.min.js') }}"></script>
<style>html,body{margin:0;height:100%;background:#eef1f4;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d2d3e}
header{background:#12324f;color:#fff;padding:12px 16px;font-weight:700}header small{display:block;font-weight:400;opacity:.85}
model-viewer{width:100%;height:calc(100% - 64px);background:radial-gradient(circle at 50% 35%,#fff,#dfe5ea)}
#ar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#0070f2;color:#fff;border:0;border-radius:24px;padding:14px 22px;font:700 16px system-ui;box-shadow:0 4px 12px rgba(0,0,0,.25)}</style>
</head><body>
<header>{{ nome }}<small>MASTER CAD AI · trascina per ruotare, «Vedi nel tuo spazio» per la realtà aumentata</small></header>
<model-viewer src="{{ glb }}" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1.05" alt="{{ nome }}">
  <button slot="ar-button" id="ar">📱 Vedi nel tuo spazio</button>
</model-viewer>
</body></html>
