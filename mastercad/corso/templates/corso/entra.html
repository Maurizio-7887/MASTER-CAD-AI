<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entra nel corso · MASTER CAD AI</title>
<link rel="stylesheet" href="{{ url_for('home.static', filename='fiori.css') }}">
<style>.box{max-width:420px;margin:8vh auto 0}</style></head>
<body>
<header class="shell"><span class="logo">MASTER <b>CAD AI</b></span><span class="titolo">Corso</span></header>
<main class="pagina"><section class="carta box">
  <h1>Entra nel corso</h1>
  <p class="sotto">Il codice te lo dà il docente (es. CAD-7K2P). La prima volta scegli tu il PIN: ti servirà per rientrare e ritrovare il tuo lavoro.</p>
  {% if errore %}<div class="messaggio err">{{ errore }}</div>{% endif %}
  <form method="post" action="/corso/entra" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf_entra }}">
    <label for="codice">Codice del corso</label><input id="codice" name="codice" required maxlength="12" style="text-transform:uppercase" value="{{ request.form.get('codice','') }}">
    <label for="nome">Nome e cognome</label><input id="nome" name="nome" required maxlength="80" value="{{ request.form.get('nome','') }}">
    <label for="pin">PIN (4–8 cifre)</label><input id="pin" name="pin" required inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" type="password">
    <div class="azioni"><button class="btn" type="submit" style="width:100%">Entra</button></div>
  </form>
  <p class="sotto" style="margin-top:14px;font-size:12.5px">Sei il docente? <a href="/login">Accedi con la password del servizio</a>.</p>
</section></main></body></html>
