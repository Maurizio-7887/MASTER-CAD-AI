name: Test MASTER CAD AI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cadtest
          POSTGRES_PASSWORD: cadtest
          POSTGRES_DB: mastercad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadtest -d mastercad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install CAD and web dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run geometry and HTTP tests
        env:
          PYTHONPATH: .
          COOKIE_SECURE: '0'
          MASTER_CAD_OUTPUT: /tmp/cad-ai-test
          DATABASE_URL: postgresql://cadtest:cadtest@localhost:5432/mastercad
        run: python -m unittest discover -s tests -v
