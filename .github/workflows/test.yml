name: Test MASTER CAD AI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install CAD and web dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run geometry and HTTP tests
        env:
          PYTHONPATH: .
          COOKIE_SECURE: '0'
          MASTER_CAD_OUTPUT: /tmp/cad-ai-test
        run: python -m unittest discover -s tests -v
